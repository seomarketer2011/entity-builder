name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @entity-builder/web build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and run RLS tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "create database entity_builder"
          psql -h localhost -U postgres -d entity_builder -v ON_ERROR_STOP=1 -f supabase/tests/local_auth_stub.sql
          for f in supabase/migrations/*.sql; do
            echo "== $f"
            psql -h localhost -U postgres -d entity_builder -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -h localhost -U postgres -d entity_builder -v ON_ERROR_STOP=1 -f supabase/tests/rls_test.sql
